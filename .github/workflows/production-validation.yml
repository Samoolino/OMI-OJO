name: Blue-Ether Production Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile production code
        run: python -m compileall -q src production tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Confirm fail-closed readiness boundary
        shell: bash
        run: |
          set +e
          python production/gate.py
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            echo "Unexpected readiness-gate status: $status"
            exit 1
          fi
          echo "Readiness remains correctly blocked pending mandatory S4 evidence."
